<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wikiest Link · Scoreboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.orange.min.css" integrity="sha384-Lm2BRg+RVlMvrTWma56pxmcU1F+JLC10iu1gmc37k8aBIhcsVT4htOZ7eubKpUV7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/acme@5.3.0/index.css" integrity="sha384-U2Cwo4qBTs74k28Xy82giXTL4Hl4gcASesb5uRlclWjZdE051iTEwHlW05jSvPJi" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/permanent-marker@5.3.0/index.css" integrity="sha384-CMsh6IR48JKQQPH0gJJDTlh/8atPvP99yKNCRbdaYanh1YOamHlq4z3zfA6Ady11" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7/js/all.min.js"
    data-mutate-approach="sync"></script>
  <script type="module" src="js/scoreboard.js"></script>
</head>
<body data-type="market">
  <main id="stage">
    <nav>
      <ul>
        <li><mark id="sb-type">THE WIKIEST LINK</mark></li>
        <li id="sb-goal"></li>
      </ul>
      <ul>
        <li id="sb-round"></li>
        <li id="sb-final" hidden><mark><span class="fa-solid fa-fire-flame-curved" aria-hidden="true"></span> FINAL ROUND</mark></li>
      </ul>
    </nav>

    <hgroup>
      <h1 id="sb-category"></h1>
      <p id="sb-period"></p>
    </hgroup>

    <section id="sb-players" aria-label="Players"></section>

    <article id="sb-reveal" hidden>
      <header>
        <h2><span class="fa-solid fa-eye" aria-hidden="true"></span> <span id="sb-reveal-title"></span></h2>
      </header>
      <table>
        <tbody id="sb-reveal-body"></tbody>
      </table>
    </article>

    <article id="sb-standings" hidden>
      <table>
        <tbody id="sb-standings-body"></tbody>
      </table>
      <footer id="sb-tiebreak" hidden>
        <span class="fa-solid fa-scale-balanced" aria-hidden="true"></span> Equal totals split by final-round score.
      </footer>
    </article>

    <footer id="sb-upnext">
      <small><span class="fa-solid fa-angles-right" aria-hidden="true"></span> UP NEXT</small>
      <strong id="sb-next"></strong>
    </footer>
  </main>

  <template id="tpl-player">
    <article>
      <header>
        <hgroup>
          <h2></h2>
          <p>&nbsp;</p>
        </hgroup>
      </header>
      <p></p>
      <div>
        <table>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </template>

  <template id="tpl-pick">
    <tr>
      <td><strong></strong><br><small><span class="fa-solid fa-eye" aria-hidden="true"></span></small></td>
      <td><strong></strong></td>
    </tr>
  </template>

  <template id="tpl-miss">
    <tr>
      <td><s></s><br><small><span class="fa-solid fa-xmark" aria-hidden="true"></span> miss</small></td>
      <td><strong></strong></td>
    </tr>
  </template>

  <template id="tpl-empty">
    <tr>
      <td>—</td>
      <td></td>
    </tr>
  </template>

  <template id="tpl-reveal">
    <tr>
      <th scope="row"></th>
      <td><span class="fa-solid fa-eye" aria-hidden="true"></span></td>
    </tr>
  </template>

  <template id="tpl-reveal-none">
    <tr>
      <td colspan="2">Every valid answer was picked.</td>
    </tr>
  </template>

  <template id="tpl-standing">
    <tr>
      <td></td>
      <th scope="row"></th>
      <td></td>
    </tr>
  </template>
</body>
</html>
